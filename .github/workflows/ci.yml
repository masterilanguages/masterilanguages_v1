name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # `next lint` cannot start on ESLint 10 (it passes removed CLI options),
      # so this job runs the unit tests instead of a linter that exits before
      # reading any file.
      - run: npm test
